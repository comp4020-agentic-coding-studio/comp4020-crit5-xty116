<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TURNLINE is a compact live-routing game about switching a moving signal through five increasingly tangled rail networks."
    />
    <meta property="og:title" content="TURNLINE" />
    <meta
      property="og:description"
      content="Keep the signal alive. Five lines, one live routing desk."
    />
    <meta property="og:image" content="./card.png" />
    <meta name="theme-color" content="#0a0b0b" />
    <title>TURNLINE - live routing game</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#top" aria-label="TURNLINE home">
        <span class="wordmark-mark" aria-hidden="true"></span>
        <span>TURNLINE</span>
      </a>
      <span class="desk-label">ROUTING DESK / 05</span>
      <nav class="toolbar" aria-label="Game controls">
        <button class="icon-button" id="restart-button" type="button" title="Restart line">
          <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          <span class="sr-only">Restart line</span>
        </button>
        <button class="icon-button" id="sound-button" type="button" title="Mute sound">
          <i data-lucide="volume-2" aria-hidden="true"></i>
          <span class="sr-only">Mute sound</span>
        </button>
      </nav>
    </header>

    <main class="game-stage" id="top">
      <section class="title-lockup" aria-labelledby="game-title">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>Live signal / manual routing</p>
        <h1 id="game-title"><span>TURN</span><span>LINE</span></h1>
      </section>

      <dl class="metrics" aria-label="Current run">
        <div>
          <dt>Line</dt>
          <dd id="line-readout">01 / 05</dd>
        </div>
        <div>
          <dt>Signal</dt>
          <dd id="time-readout">00.0</dd>
        </div>
        <div>
          <dt>Faults</dt>
          <dd id="fault-readout">00</dd>
        </div>
      </dl>

      <section class="board-shell" aria-label="Live rail network">
        <canvas id="track-canvas" data-testid="track-canvas" aria-hidden="true"></canvas>
        <div class="junction-layer" id="junction-layer"></div>
      </section>

      <ol class="line-progress" id="line-progress" aria-label="Route progress"></ol>

      <p class="status-line" id="status-line">
        <span class="status-index">01</span>
        <span id="status-copy">Signal held</span>
      </p>

      <section class="result-overlay" id="result-overlay" hidden aria-labelledby="result-title">
        <div class="result-copy">
          <p class="eyebrow" id="result-kicker">Line 01</p>
          <h2 id="result-title">MISROUTED</h2>
          <p id="result-detail">The signal reached a dead line.</p>
          <button class="result-action" id="result-action" type="button">
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
            <span>Run again</span>
          </button>
        </div>
      </section>

      <p class="sr-only" id="live-status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
